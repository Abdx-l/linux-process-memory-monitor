name: Linux build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      - run: make
      - run: timeout 3 ./procmon --daemon /tmp/procmon.log || test $? -eq 124
